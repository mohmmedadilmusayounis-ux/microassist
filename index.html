<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Mohammed Adil – Medical Laboratory & Pathology Platform</title>
<meta name="description" content="Medical laboratory science and pathology reference for students, technicians and specialists: laboratory tests with principles, procedures, QC, reference values, interpretation, a digital slide atlas, MCQs, cases and references.">
<meta name="theme-color" content="#090d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dr. M. Adil">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'">
<style id="pageBoxes"></style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bg:#f2f5fa;--surface:#ffffff;--sunk:#f5f8fc;--line:#e2e8f1;--line2:#cfd8e6;
  --text:#0f1d36;--muted:#5d6b84;--faint:#8a96ab;
  --pri:#1f63c6;--pri2:#3b82e6;--pri-d:#16489a;--pri-bg:#e8f0fc;--on-pri:#fff;
  --ok:#22966a;--okbg:#e3f5ec;--warn:#c98512;--warnbg:#fcf1dc;--bad:#d23f57;--badbg:#fbe6ea;--vio:#7a5bd6;
  --shadow:0 1px 2px rgba(15,29,54,.05),0 6px 20px rgba(15,29,54,.06);--r:14px;
  --side:linear-gradient(180deg,#1d5dbd 0%,#174c9d 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1222;--surface:#121b2f;--sunk:#0f172a;--line:#223150;--line2:#2e4068;--text:#e7edf7;--muted:#9fb0cb;--faint:#7b8ba7;
  --pri:#5b9bf2;--pri2:#7fb1f6;--pri-d:#3b82e6;--pri-bg:#16284a;--okbg:#103425;--warnbg:#3a2a0c;--badbg:#3c1622;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--side:linear-gradient(180deg,#10284f 0%,#0c1d3b 100%);
}}
:root[data-theme="dark"]{
  --bg:#0b1222;--surface:#121b2f;--sunk:#0f172a;--line:#223150;--line2:#2e4068;--text:#e7edf7;--muted:#9fb0cb;--faint:#7b8ba7;
  --pri:#5b9bf2;--pri2:#7fb1f6;--pri-d:#3b82e6;--pri-bg:#16284a;--okbg:#103425;--warnbg:#3a2a0c;--badbg:#3c1622;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--side:linear-gradient(180deg,#10284f 0%,#0c1d3b 100%);
}
/* high contrast (theme button): pure black on white, strong borders, darker accents (WCAG AAA text contrast) */
:root[data-theme="contrast"]{
  --bg:#ffffff;--surface:#ffffff;--sunk:#ffffff;--line:#000000;--line2:#000000;--text:#000000;--muted:#1a1a1a;--faint:#333333;
  --pri:#0033a0;--pri2:#0033a0;--pri-d:#001f66;--pri-bg:#dfe7ff;--ok:#00603a;--okbg:#ffffff;--warn:#7a4a00;--warnbg:#ffffff;--bad:#a0001b;--badbg:#ffffff;--vio:#4b1fa8;
  --shadow:none;--side:#001a4d;
}
:root[data-theme="contrast"] :focus-visible{outline:3px solid #000;outline-offset:3px}
:root[data-theme="contrast"] .card{border-width:2px}
:root[data-theme="contrast"] a:not(.btn):not(.trow):not(.nav a){text-decoration:underline}
/* automatic theme: follow the system's "increase contrast" setting with stronger text and borders */
@media (prefers-contrast:more){:root:not([data-theme]){--muted:#2c3a52;--faint:#3f4d66;--line:#8a96ab;--line2:#5d6b84}}
@media (prefers-contrast:more) and (prefers-color-scheme:dark){:root:not([data-theme]){--muted:#d5deec;--faint:#c0cbe0;--line:#7b8ba7;--line2:#9fb0cb}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
html[lang="ar"]{--sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- shell: sidebar (computer), app bar + tab bar (phone) ---- */
.side{position:fixed;inset-block:0;inset-inline-start:0;width:250px;background:var(--side);color:#e8f0ff;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;text-decoration:none;color:#fff}
.mono{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;color:#1d5dbd;font:800 1rem var(--sans);letter-spacing:.02em;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.brand b{display:block;font-size:.98rem;line-height:1.25}
.brand small{display:block;font-size:.72rem;opacity:.8;line-height:1.3}
.nav{display:grid;gap:2px;padding:8px 10px;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#d7e4fb;font-weight:500;font-size:.92rem}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:#16489a;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.nav .sep{height:1px;background:rgba(255,255,255,.14);margin:8px 6px}
.side .foot{margin-top:auto;padding:14px 18px;font-size:.74rem;opacity:.8;border-top:1px solid rgba(255,255,255,.12)}
.main{margin-inline-start:250px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:1.12rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbox{position:relative;flex:1;max-width:520px;margin-inline-start:auto}
.sbox svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.sbox input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 12px;padding-inline-start:38px;font-size:.92rem}
.sbox input:focus{background:var(--surface);border-color:var(--pri2)}
.tools{display:flex;align-items:center;gap:8px}
.ibtn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.ibtn:hover{color:var(--pri)}
.langs{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.langs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.8rem;padding:6px 10px;border-radius:7px}
.langs button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.langs button[lang="ar"]{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
.content{padding:22px 24px 40px;max-width:1280px;width:100%}
.mbar{display:none}
.tabbar{display:none}
@media (max-width:999px){
  .side{display:none}
  .main{margin-inline-start:0}
  .mbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--side);color:#fff;position:sticky;top:0;z-index:25}
  .mbar .brand{padding:0;flex:1;min-width:0}
  .mbar .brand b{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .mono{width:36px;height:36px;font-size:.9rem;border-radius:10px}
  .mbar .ibtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
  .mbar .langs{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
  .mbar .langs button{color:#dbe7fb}
  .mbar .langs button[aria-pressed="true"]{background:#fff;color:#16489a}
  .top{top:calc(56px + env(safe-area-inset-top,0px));padding:10px 14px}
  .top h1,.top .tools{display:none}
  .sbox{max-width:none;margin:0}
  .content{padding:16px 14px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(15,29,54,.06)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--faint);font-size:.68rem;font-weight:600;padding:4px 0}
  .tabbar a .ic{display:grid;place-items:center;width:46px;height:28px;border-radius:999px}
  .tabbar a[aria-current="page"]{color:var(--pri)}
  .tabbar a[aria-current="page"] .ic{background:var(--pri-bg)}
}

/* ---- building blocks ---- */
.view>*{animation:fade .3s both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view>*{animation:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;padding:14px 16px 0}
.ch h2,.ch h3{margin:0;font-size:.98rem;font-weight:700}
/* short header links stay on one line; long ones (e.g. "Related test: …") wrap instead of widening the page */
.ch .more{font-size:.8rem;color:var(--pri);text-decoration:none;font-weight:600;min-width:0;overflow-wrap:anywhere}
.cb{padding:14px 16px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dash{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.dash{grid-template-columns:minmax(0,1fr)}}
.kpi{display:flex;align-items:center;gap:12px;padding:16px}
.kpi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--pri-bg);color:var(--pri)}
.kpi b{display:block;font-size:1.5rem;line-height:1.1;font-weight:800}
.kpi span{color:var(--muted);font-size:.8rem}
.pagehead{display:flex;align-items:center;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.pagehead h2{margin:0;font-size:1.4rem;font-weight:800;line-height:1.25}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.picon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--pri);color:var(--on-pri);flex:none}
.picon svg.i{width:24px;height:24px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.86rem;margin:0 0 12px}
html[dir="rtl"] .back svg,html[dir="rtl"] .go svg{transform:scaleX(-1)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-pri{background:var(--pri-bg);color:var(--pri)}.b-bad{background:var(--badbg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;color:var(--text);text-decoration:none}
.btn:hover{border-color:var(--pri2);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.pri:hover{background:var(--pri-d);color:var(--on-pri)}
.btn[aria-pressed="true"]{background:var(--pri-bg);border-color:var(--pri2);color:var(--pri)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);padding:32px 16px}
.empty svg.i{width:34px;height:34px;color:var(--pri2)}
.note{font-size:.84rem;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warnbg);color:var(--text);font-size:.86rem;border-inline-start:3px solid var(--warn)}
.notice svg.i{color:var(--warn)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
html[lang="ar"] .tbl th{text-transform:none;letter-spacing:0;font-size:.8rem}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl a{text-decoration:none;font-weight:600}
.tbl a:hover{color:var(--pri)}
.tbl .sub{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.scroll-x{overflow-x:auto}

/* charts */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,150px) 1fr 32px;align-items:center;gap:10px;font-size:.82rem;text-decoration:none}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.bar .tr{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar .fl{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.bar b{font:600 .8rem var(--mono);text-align:end}
.donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:grid;gap:6px;font-size:.84rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:7px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}

/* digital slide */
.slide{position:relative;border-radius:12px;overflow:hidden;background:#0d1426;aspect-ratio:16/10;cursor:zoom-in}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide .nav2{position:absolute;inset-block-end:10px;inset-inline-end:10px;display:flex;gap:6px}
.slide .nav2 button{width:34px;height:34px;border-radius:9px;border:0;background:rgba(255,255,255,.9);color:#16489a;display:grid;place-items:center}
.slide .tag{position:absolute;inset-block-start:10px;inset-inline-start:10px;background:rgba(13,20,38,.75);color:#fff;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px}
.cap{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.cap small{display:block;color:var(--faint);font-size:.72rem;margin-top:2px}
.viewer{position:relative;overflow:hidden;border-radius:12px;background:#0d1426;aspect-ratio:4/3;touch-action:none;user-select:none}
.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:0 0;-webkit-user-drag:none;pointer-events:none}
.vtools{position:absolute;inset-block-end:10px;inset-inline-end:10px;display:flex;gap:6px;z-index:2}
.vtools button{min-width:36px;height:36px;padding:0 8px;border-radius:9px;border:0;background:rgba(255,255,255,.92);color:#16489a;font-weight:800;font-size:1rem}
.vzoom{position:absolute;inset-block-start:10px;inset-inline-start:10px;background:rgba(13,20,38,.75);color:#fff;font:600 .74rem var(--mono);padding:4px 9px;border-radius:999px;z-index:2}
.atl .ph{aspect-ratio:4/3}
/* modular topic page */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--faint);margin:0 0 10px}
.crumbs a{color:var(--pri);text-decoration:none;font-weight:600}
.topic{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start;margin-top:16px}
.tmain{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.tsec{min-width:0}
.taside{position:sticky;top:76px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.tsec{padding:16px 18px;scroll-margin-top:120px}
.tsec h3{display:flex;align-items:center;gap:9px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:1rem;font-weight:700}
.tsec h3 .num{flex:none;min-width:24px;height:24px;border-radius:7px;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font:700 .74rem var(--mono)}
.tsec h3 svg.i{color:var(--pri)}
.tsec p{margin:0}
.toc{padding:10px}
.toch{font:700 .72rem var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:2px 6px 8px}
html[lang="ar"] .toch{text-transform:none;letter-spacing:0;font-size:.8rem}
.tocl{display:flex;gap:8px;align-items:center;width:100%;text-align:start;border:0;background:none;padding:7px 8px;border-radius:8px;color:var(--text);font-size:.86rem}
.tocl:hover{background:var(--pri-bg);color:var(--pri)}
.tocl span{font:600 .72rem var(--mono);color:var(--faint);min-width:18px}
.qf{padding:12px 14px}
.qf dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;font-size:.84rem}
.qf dt{color:var(--muted)}
.qf dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.qf a{color:var(--pri)}
.keybox{background:var(--pri-bg);border-inline-start:4px solid var(--pri);border-radius:10px;padding:12px 14px}
.keybox .ilist li{font-weight:500}
.lead{margin:0 0 10px!important;padding:10px 12px;background:var(--sunk);border-radius:10px;font-size:.92rem}
.subh{margin:16px 0 8px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mkt th{white-space:nowrap}
.mkt td{font-size:.86rem}
.viewerc{padding:14px;margin-top:14px}
.viewerc .viewer{aspect-ratio:16/9;max-height:62vh;width:100%}
@media (max-width:760px){.viewerc .viewer{aspect-ratio:4/3}}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumb{width:76px;height:56px;padding:0;border-radius:8px;overflow:hidden;border:2px solid var(--line);background:none}
.thumb.on{border-color:var(--pri)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:1000px){
  .topic{grid-template-columns:minmax(0,1fr)}
  .taside{position:sticky;top:calc(118px + env(safe-area-inset-top,0px));z-index:5;order:-1}
  .toc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px}
  .toc::-webkit-scrollbar{display:none}
  .toch,.qf{display:none}
  .tocl{flex:none;width:auto;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:.78rem;white-space:nowrap}
}
.lb{position:fixed;inset:0;z-index:60;background:rgba(6,10,20,.92);display:flex;flex-direction:column}
.lb .stage{flex:1;overflow:hidden;display:grid;place-items:center;touch-action:none}
.lb img{max-width:100%;max-height:100%;transform-origin:center;transition:transform .15s;user-select:none}
.lb .bar2{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));color:#dce6f7;font-size:.82rem}
.lb .bar2 .btns button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}

/* branch cards and rows */
.bcard{display:flex;align-items:center;gap:14px;padding:16px;text-decoration:none;transition:transform .15s,box-shadow .2s}
.bcard:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(31,99,198,.14)}
.bcard .bi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--pri-bg);color:var(--pri);flex:none}
.bcard strong{display:block;font-size:.95rem;line-height:1.3}
.bcard small{display:block;color:var(--muted);font-size:.8rem}
.bcard .n{margin-inline-start:auto;font:600 .8rem var(--mono);color:var(--pri);background:var(--pri-bg);padding:3px 9px;border-radius:999px}
.rows{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none}
.trow:hover{border-color:var(--pri2)}
.trow .bi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--pri-bg);color:var(--pri);flex:none}
.trow .tt{flex:1;min-width:0}
.trow b{display:block;font-size:.93rem;line-height:1.35;font-weight:600}
.trow small{display:block;color:var(--muted);font-size:.8rem;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
.trow .go{color:var(--faint)}
.grp{font-weight:700;font-size:.82rem;color:var(--muted);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
html[lang="ar"] .grp{text-transform:none;letter-spacing:0}

/* test page */
.thead{padding:18px;display:grid;gap:12px}
.thead .t1{display:flex;align-items:flex-start;gap:14px}
.thead h2{margin:0;font-size:1.3rem;line-height:1.3;font-weight:800}
.thead .ar{color:var(--muted);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
.secnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:none;text-decoration:none;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--sunk);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
.secnav a:hover{color:var(--pri);border-color:var(--pri2)}
.tgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
.tgrid .col{display:grid;gap:16px}
@media (max-width:1000px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.sec{scroll-margin-top:120px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0;font-size:.95rem;font-weight:700}
.sec h3 svg.i{color:var(--pri)}
.sec p{margin:0}
.sec ul{margin:0;padding-inline-start:20px}
.sec li{margin:0 0 5px}
.kv{display:grid;gap:10px}
.sample{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.tubes{display:flex;gap:4px;flex:none}
.tube{display:grid;justify-items:center;gap:2px;width:44px;text-align:center;font:600 .6rem/1.1 var(--sans);color:var(--muted)}
.tube svg{width:20px;height:40px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;display:grid;grid-template-columns:42px 1fr;gap:12px;padding:0 0 14px;counter-increment:s}
.steps li::before{content:"";position:absolute;inset-inline-start:20px;top:42px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child{padding-bottom:0}.steps li:last-child::before{display:none}
.pic{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--pri-bg);color:var(--pri);border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
.pic::after{content:counter(s);position:absolute;top:-6px;inset-inline-end:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:999px;background:var(--pri);color:var(--on-pri);font:700 .66rem/19px var(--mono);text-align:center;box-shadow:0 0 0 2px var(--surface)}
.steps .txt{font-size:.9rem;padding-top:2px}
.steps .tag{display:block;font:600 .64rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pri)}
html[lang="ar"] .steps .tag{font:700 .72rem "IBM Plex Sans Arabic",Tahoma,sans-serif;letter-spacing:0}
.rng th{width:44%}
.rng td{font-weight:600}
.rng .u{font:500 .74rem var(--mono);color:var(--pri);white-space:nowrap}
.edubadge{display:flex;gap:8px;align-items:flex-start;font-size:.78rem;color:var(--muted);background:var(--pri-bg);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.edubadge svg.i{width:16px;height:16px;color:var(--pri)}
.ilist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ilist li{display:flex;gap:8px;font-size:.9rem}
.ilist li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:8px;background:var(--pri2)}
.ilist.warn li::before{background:var(--warn)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fig{margin:0}
.fig .ph{border-radius:10px;overflow:hidden;background:#0d1426;cursor:zoom-in;aspect-ratio:4/3}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.fig svg.sch{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.fig figcaption{font-size:.78rem;color:var(--muted);margin-top:6px}
.fig figcaption small{display:block;color:var(--faint)}
.refs{margin:0;padding-inline-start:22px;font-size:.84rem;display:grid;gap:6px}
.refs a{color:var(--pri);word-break:break-all}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pn a{padding:12px 14px;text-decoration:none;font-size:.86rem;font-weight:600;min-width:0}
.pn a span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{display:block;color:var(--muted);font-size:.72rem}
.pn .nx{grid-column:2;text-align:end}

/* learn */
.lcard{display:grid;gap:8px;padding:18px;text-decoration:none}
.lcard .bi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.lcard strong{font-size:1rem}
.lcard span{color:var(--muted);font-size:.86rem}
.qbox{padding:18px}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.prog{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--pri)}
.qtext{font-size:1.05rem;font-weight:600;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt:hover{border-color:var(--pri2)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--sunk);font:600 .78rem var(--mono)}
.opt.sel{border-color:var(--pri);background:var(--pri-bg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.expl{margin-top:12px;padding:12px;border-radius:10px;background:var(--sunk);font-size:.88rem}
.expl small{display:block;color:var(--muted);margin-top:4px}
.score{font-size:2.4rem;font-weight:800;color:var(--pri)}
.flash{perspective:1000px;cursor:pointer;min-height:220px}
.flash .in{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);backface-visibility:hidden;font-size:1.05rem;font-weight:600}
.flash .fc.b{transform:rotateY(180deg);background:var(--pri-bg);font-weight:500;font-size:.98rem}
.flash .fc small{display:block;color:var(--muted);font-size:.74rem;font-weight:600;margin-bottom:8px;text-transform:uppercase}
.timer{font:600 .9rem var(--mono);color:var(--pri)}
.about{padding:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--side);color:#fff;border:0}
.about .mono{width:72px;height:72px;font-size:1.6rem;border-radius:18px}
.about h2{margin:0;font-size:1.4rem}
.about p{margin:4px 0 0;opacity:.85;font-size:.9rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;max-width:480px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;background:#0f1d36;color:#fff;border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);font-size:.88rem}
.toast button{border:0;border-radius:8px;background:var(--pri2);color:var(--on-pri);font-weight:700;padding:7px 12px}
@media (min-width:1000px){.toast{bottom:24px}}
.toast{border-inline-start:5px solid var(--pri2);animation:fade .2s both}
.toast[data-kind="ok"]{border-inline-start-color:#2fbf86}
.toast[data-kind="err"]{border-inline-start-color:#ff6b81}
:root[data-theme="contrast"] .toast{background:#000;border:2px solid #fff;border-inline-start-width:6px}
/* hide any hosting badge that could be injected into the page (none is part of the app) */
a[href*="netlify.com"],a[href*="netlify.app/?utm"],[class*="netlify-badge"],[id^="netlify-"],[class^="netlify-"],netlify-drawer,#nl-badge-frame{display:none!important}
footer{margin-top:auto;padding:16px 24px;color:var(--faint);font-size:.78rem;border-top:1px solid var(--line)}
.ch h3>svg.i{margin-inline-end:7px;vertical-align:-4px}
/* ---- clinical search: disease panel ---- */
.dxcard{margin-bottom:16px;border-inline-start:4px solid var(--pri)}
.dxcard h3{display:flex;align-items:center;gap:8px}
.dxl{margin:0;padding-inline-start:22px;display:grid;gap:6px}
.dxl a{font-weight:600;color:var(--pri);text-decoration:none}
.dxl small{display:block;color:var(--muted);font-size:.8rem}
/* ---- calculators ---- */
.calcg{margin-top:16px;align-items:start}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);margin-bottom:14px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.84rem;padding:7px 12px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.cform{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cform.conv{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end}
.cform .cwide{grid-column:1/-1}
.cfld{display:grid;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
.cfld em{font-style:normal;font-weight:500;color:var(--faint)}
.cfld input,.cfld select{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--text)}
.cfld input:focus,.cfld select:focus{border-color:var(--pri2);outline:none;box-shadow:0 0 0 3px var(--pri-bg)}
.cfld input[aria-invalid="true"]{border-color:var(--bad);background:var(--badbg)}
.cvsw{display:grid;place-items:center;height:44px;color:var(--faint)}
.cres{border-top:4px solid var(--line2);min-height:150px}
.cres.ok{border-top-color:var(--ok)}.cres.warn{border-top-color:var(--warn)}.cres.bad{border-top-color:var(--bad)}
.rlab{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rval{margin:6px 0 2px;font:800 2.4rem/1.1 var(--sans);color:var(--text)}
.rval span{font-size:1rem;font-weight:600;color:var(--muted)}
.cres.ok .rval b{color:var(--ok)}.cres.warn .rval b{color:var(--warn)}
.ralt{color:var(--muted);font-weight:600}
.rint{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:.9rem}
.rerr{display:flex;gap:8px;align-items:flex-start;color:var(--bad);font-weight:600;margin:8px 0 0}
.formula{margin:0;font:500 .88rem/1.7 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-wrap:anywhere}
/* ---- case studies v2 ---- */
.labt td,.labt th{white-space:normal}
.cstep{margin-top:12px}
.cstep h3{margin:4px 0 6px;font-size:1.05rem}
.ph.phold{display:grid;place-items:center;gap:8px;text-align:center;padding:18px;color:var(--muted);background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 10px,var(--surface) 10px,var(--surface) 20px);font-size:.84rem;aspect-ratio:4/3}
/* ---- lab assistant ---- */
.aibox{margin-top:16px}
.aibox .ch h3{display:flex;align-items:center;gap:8px}
.aibox button.more{border:0;background:none;cursor:pointer}
.ailog{display:grid;gap:10px;margin-bottom:12px}
.ailog:empty{display:none}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.92rem;line-height:1.55}
.msg small{display:block;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.msg p{margin:0;white-space:pre-wrap}
.msg.me{justify-self:end;background:var(--pri);color:var(--on-pri);border-end-end-radius:4px}.msg.me small{color:rgba(255,255,255,.8)}
.msg.bot{justify-self:start;background:var(--sunk);border:1px solid var(--line);border-end-start-radius:4px}
.msg.wait p{color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.msg details{margin-top:8px;font-size:.82rem}.msg summary{cursor:pointer;color:var(--pri);font-weight:600}
.msg blockquote{margin:6px 0 0;padding:6px 10px;border-inline-start:3px solid var(--pri2);background:var(--surface);border-radius:6px;color:var(--muted)}
.aiform{display:flex;gap:8px;align-items:stretch}
.aiform textarea{flex:1;min-width:0;resize:vertical;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem;color:var(--text)}
.aiform textarea:focus{border-color:var(--pri2);outline:none;box-shadow:0 0 0 3px var(--pri-bg)}
.aiw{display:flex;gap:6px;align-items:flex-start;font-size:.78rem;margin-bottom:0}.aiw svg{width:16px;height:16px;flex:none;margin-top:2px}
.ainote{margin:0;padding:8px 12px;border-radius:10px;background:var(--warnbg);color:var(--text);font-size:.88rem}
/* ---- chips (filters, examples) ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.chip:hover{border-color:var(--pri2);color:var(--pri)}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tchip,.tchips a{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--pri-bg);color:var(--pri);font-size:.8rem;font-weight:600;text-decoration:none}
/* ---- results interpreter ---- */
.iptop{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:14px}
.iptop>.note{display:flex;gap:6px;align-items:center;margin:0}.iptop>.note svg{width:16px;height:16px}
.ipgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.ipform{display:grid;gap:16px;min-width:0}.ipres{display:grid;gap:12px;align-content:start;min-width:0}
@media (min-width:1100px){.ipgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}.ipres{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-bottom:8px}}
.ipf{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.iphint{font-weight:500;color:var(--faint);font-size:.74rem}
.ipchk{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:600;color:var(--muted);align-self:end;padding-bottom:10px}
.ipchk input{width:18px;height:18px;accent-color:var(--pri)}
.cfld input.ipfl-L,.cfld input.ipfl-H{border-color:var(--warn);background:var(--warnbg)}
.cfld input.ipfl-LL,.cfld input.ipfl-HH{border-color:var(--bad);background:var(--badbg);font-weight:700}
.critbox{border:1.5px solid var(--bad);background:var(--badbg)}
.critbox .cb>b{display:flex;gap:8px;align-items:flex-start;color:var(--bad)}.critbox .cb>b svg{flex:none}
.ipres>*,.ipform>*{min-width:0}
.critbox ul{margin:8px 0 0;padding-inline-start:20px}
.ipbad .cb{display:flex;gap:8px;color:var(--bad);font-weight:600;font-size:.9rem}
.iptbl td,.iptbl th{white-space:normal}.iptbl .u{color:var(--muted);font-size:.8rem}
.iptbl .badge{margin-top:4px;white-space:nowrap}.iptbl tr.flagged td:first-child{font-weight:700}
.b-bad{background:var(--badbg);color:var(--bad)}
.ipder{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.9rem}
.ipder dt{font-weight:600;color:var(--muted)}.ipder dt a{color:var(--pri)}
.ipder dd{margin:0}.ipder dd small{display:block;color:var(--muted);font-size:.8rem}
.pcard{border-inline-start:4px solid var(--pri2)}
.pcard.bad{border-inline-start-color:var(--bad)}.pcard.warn{border-inline-start-color:var(--warn)}.pcard.info{border-inline-start-color:var(--ok)}
.pcard h4,.preitem h4{margin:0 0 6px;font-size:1rem}
.pcard p{margin:0 0 8px;font-size:.92rem}
.pl{margin-top:8px}.pl>b{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pl .ilist{margin-top:4px}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:10px 0 0!important;font-size:.78rem;color:var(--faint)}
.pmeta a{display:inline-flex;gap:5px;align-items:center;color:var(--pri);font-weight:600;text-decoration:none}.pmeta svg{width:15px;height:15px}
.ipcl summary{padding:14px 16px;cursor:pointer;font-weight:700}
.ipdisc{display:flex;gap:8px;align-items:flex-start;margin:0}.ipdisc svg{flex:none;width:16px;height:16px;margin-top:3px}
/* ---- specimen collection guide ---- */
.pretools .cb{display:grid;gap:12px}
.prerow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.precount{margin:12px 0 8px}
.pregrid{margin-top:12px;align-items:start}
.tcap{display:inline-block;flex:none;width:18px;height:22px;border-radius:5px 5px 3px 3px;background:linear-gradient(90deg,var(--cap) 50%,var(--cap2,var(--cap)) 50%);box-shadow:inset 0 -6px 0 rgba(255,255,255,.35),0 0 0 1px rgba(0,0,0,.12);vertical-align:middle}
.odraw{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));counter-reset:none}
.odraw a{display:grid;grid-template-columns:auto auto 1fr;gap:2px 8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);text-decoration:none;color:var(--text);height:100%}
.odraw b{font-size:1.1rem;color:var(--pri)}
.odraw span{font-weight:600;font-size:.84rem;line-height:1.3}
.odraw small{grid-column:1/-1;color:var(--muted);font-size:.74rem}
.tubec h3{display:flex;align-items:center;gap:8px}
.onum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--on-pri);font-size:.8rem;font-weight:800;flex:none}
.tubec .ar,.preitem .ar{color:var(--muted);font-size:.85rem;margin:-2px 0 10px}
.tubec .ipder{margin-bottom:10px}
.preitem.reject{border-inline-start:4px solid var(--bad)}.preitem.prep{border-inline-start:4px solid var(--ok)}
.preitem.coll,.preitem.trans{border-inline-start:4px solid var(--pri2)}
.preitem .badge{margin-bottom:6px}
.prelook{border:1.5px solid var(--pri2);margin-bottom:12px}
.prelook h3 a{color:var(--pri);text-decoration:none}
.prelook button.more{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer}
/* ---- laboratory instruments ---- */
.v3grid{margin-bottom:6px}
.v3tile{display:flex;gap:12px;align-items:flex-start;padding:14px;text-decoration:none;color:var(--text)}
.v3tile .tt{display:grid;gap:2px;flex:1;min-width:0}.v3tile small{color:var(--muted)}.v3tile .note{margin:4px 0 0;font-size:.82rem}
.v3tile .badge{flex:none;align-self:center}
.soonl li{color:var(--muted)}
.v3card{padding:10px;margin:14px 0 0}
/* device photo: the placeholder covers the space until the photo loads; it stays if the file is missing */
.devbox{position:relative;max-width:800px;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--sunk)}
.devimg{display:block;max-width:100%;height:auto;object-fit:contain;margin:0 auto;opacity:0;transition:opacity .25s}
.devbox.ok .devimg{opacity:1}
.devph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;padding:16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:12px;background:var(--sunk)}
.devph svg{width:34px;height:34px}.devph b{color:var(--text);font-size:1rem}.devph small{font-size:.8rem}
.devbox.ok .devph{display:none}
/* loading skeleton: a soft moving sheen while the photo or 3D model loads (not when the file is missing) */
.skel,.devbox:not(.ok):not(.missing) .devph,.v3load:not(.done){background-image:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--surface) 70%,transparent) 50%,transparent 70%);background-size:220% 100%;animation:sheen 1.3s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.skel,.devbox .devph,.v3load{animation:none!important}}
/* staining simulator */
.simtrack{list-style:none;margin:14px 0;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.simtrack li{flex:none;display:grid;justify-items:center;gap:1px;min-width:86px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-size:.72rem;color:var(--muted)}
.simtrack li span{display:grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--sunk);font-weight:700;color:var(--text)}
.simtrack li b{font-size:.74rem;color:var(--text)}.simtrack li small{font-size:.68rem}
.simtrack li.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bg)}.simtrack li.cur span{background:var(--pri);color:var(--on-pri)}
.simtrack li.done span{background:var(--ok);color:#fff}
.simgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.simgrid{grid-template-columns:minmax(260px,2fr) minmax(0,3fr)}}
.simvis{display:block;width:100%;height:auto;border-radius:10px}
.simpic .note{margin:8px 0 0;text-align:center}
.simbar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-bottom:10px}.simbar span{display:block;height:100%;background:var(--pri);transition:width .3s}
.simstep{margin:0 0 6px;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.simq h3{margin:4px 0 12px;font-size:1.02rem;line-height:1.45}
.simopts{display:grid;gap:8px}
.simopt{text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:.92rem;line-height:1.45;color:var(--text);transition:border-color .15s,background .15s}
.simopt:hover:not(:disabled){border-color:var(--pri2);background:var(--pri-bg)}
.simopt:disabled{cursor:default}
.simopt.ok{border-color:var(--ok);background:var(--okbg)}
.simopt.no{border-color:var(--bad);background:var(--badbg);opacity:.85}
.simfb{margin-top:12px}.simfb p{margin:6px 0}
.simfb .fbok,.simfb .fbno{display:flex;gap:8px;align-items:flex-start}
.simfb .fbok>b,.simfb .fbno>b{white-space:nowrap}
.simfb .fbok svg{color:var(--ok)}.simfb .fbno svg{color:var(--bad)}
.simfact{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--pri-bg);font-size:.88rem}
.simfb .btn{margin-top:6px}
.simdone .cb{display:grid;justify-items:center;text-align:center;gap:4px;padding:26px 18px}
.simdone>.cb>svg{width:36px;height:36px;color:var(--ok)}.simdone h3{margin:2px 0}
.simscore{font-size:2.4rem;font-weight:800;margin:0;color:var(--pri)}
.simdone ul{list-style:none;padding:0;margin:4px 0 12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.simbar span,.simopt{transition:none}}
/* headings that receive focus from script (to announce the next step) need no focus ring */
[tabindex="-1"]:focus{outline:none}
/* anatomy atlas: numbered pins positioned in % over the diagram */
.aph{background:#fff}.aph img{object-fit:contain}
.agrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.agrid{grid-template-columns:minmax(0,3fr) minmax(260px,2fr)}}
.afig{position:relative;width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:10px;overflow:hidden}
.afig img{display:block;width:100%;height:100%;object-fit:contain}
.apin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;padding:0;border-radius:999px;border:2px solid #fff;background:var(--pri);color:var(--on-pri);font:700 11px/1 var(--sans);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer;direction:ltr}
.apin:hover{background:var(--pri-d)}
.apin.on{background:#d23f57;width:28px;height:28px;font-size:13px;z-index:2;box-shadow:0 0 0 4px rgba(210,63,87,.3)}
.apin.static{position:static;transform:none;display:inline-grid;cursor:default}
@media (min-width:600px){.apin{width:26px;height:26px;font-size:12px}}
:root[data-theme="contrast"] .apin{background:#000;border-color:#fff;box-shadow:0 0 0 2px #000}
:root[data-theme="contrast"] .apin.on{background:#a0001b}
.asel h3{margin:6px 0 2px;font-size:1.1rem}
.akey{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.akey button{width:100%;display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;color:var(--text)}
.akey button:hover{border-color:var(--pri2)}
.akey li.on button{border-color:var(--bad);background:var(--badbg)}
.akey .n{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--pri);color:var(--on-pri);font-weight:700;font-size:.78rem;direction:ltr}
.akey b{display:block;font-size:.9rem}.akey small{color:var(--muted);font-size:.78rem}
.akey .hid{color:var(--faint);font-style:italic;font-size:.85rem}
.aqfig{margin:10px 0 14px}.aqfig .afig{max-width:420px}
.aqr.ok .bi{color:var(--ok)}.aqr.no .bi{color:var(--bad)}
/* image quiz */
.iqfig{margin:12px 0 4px}
.iqimg{display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--sunk);cursor:zoom-in}
.iqimg img{display:block;width:100%;max-height:420px;object-fit:contain;margin:0 auto}
.iqfig figcaption{margin-top:6px;text-align:center}
.iqrev{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.iqr{display:grid;gap:6px;padding:8px;text-decoration:none;color:var(--text);border-top:4px solid var(--ok)}
.iqr.no{border-top-color:var(--bad)}
.iqr img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.iqr span{display:grid;gap:2px;font-size:.82rem}.iqr small{color:var(--bad)}
/* decision guides */
.gtrail{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}
.gback{width:100%;display:grid;gap:2px;text-align:start;border:1px solid var(--line);border-inline-start:4px solid var(--ok);background:var(--surface);border-radius:10px;padding:8px 12px;color:var(--text);font-size:.84rem}
.gback span{color:var(--muted)}.gback:hover{border-color:var(--pri2)}
.gcur h3{margin:4px 0 12px;font-size:1.02rem;line-height:1.45}
.gres{border-inline-start:4px solid var(--pri);padding:4px 0 4px 12px;padding-inline-start:12px}
.gres>b{display:block;font-size:1.08rem;color:var(--pri-d)}
:root[data-theme="dark"] .gres>b{color:var(--pri2)}
.gres p{margin:6px 0}.gres .pl{margin-top:8px}
.gnote{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--warnbg);font-size:.88rem}
.gnote svg{color:var(--warn);flex:none}
.gchart .gq>p{margin:0 0 6px}
.gtree{list-style:none;margin:0;padding:0;padding-inline-start:14px;border-inline-start:2px solid var(--line);display:grid;gap:6px}
.gtree>li>details>summary{cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--sunk);font-weight:600;font-size:.88rem}
.gtree>li>details[open]>summary{background:var(--pri-bg);color:var(--pri-d)}
.gtree>li>details>:not(summary){margin:8px 0 4px}
@media print{.gtree>li>details>summary{background:none;padding:2px 0}.gtrail,.gcur .btns{display:none}}
/* error boundary fallback */
.fault .cb{display:grid;justify-items:center;gap:6px;text-align:center;padding:30px 18px}
.fault svg{width:34px;height:34px;color:var(--bad)}.fault h2{margin:4px 0 0;font-size:1.15rem}.fault p{margin:0 0 8px;color:var(--muted);max-width:46ch}
.devcap{margin:8px 4px 2px;text-align:center}
.devcap .devnote{display:block;margin-top:4px;color:var(--text)}
.devcap .devcredit{display:block;margin-top:4px;font-size:.74rem;color:var(--faint)}.devcap .devcredit a{color:var(--pri)}
.v3parts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.v3part{display:grid;gap:2px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--text)}
.v3part:hover{border-color:var(--pri2)}.v3part.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bg)}
.v3part small{color:var(--muted);font-size:.78rem}.v3part span{font-size:.84rem;color:var(--muted);line-height:1.45}
/* photo | 3D model tabs and the 3D viewer */
.vtabs{margin:12px 0 0}.vtabs button{display:inline-flex;gap:6px;align-items:center}.vtabs svg{width:17px;height:17px}
.v3{position:relative;height:clamp(300px,56vh,540px);border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#ffffff 0%,#e8eef6 70%);touch-action:none}
:root[data-theme="dark"] .v3{background:radial-gradient(ellipse at 50% 35%,#24324d 0%,#121b2f 75%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .v3{background:radial-gradient(ellipse at 50% 35%,#24324d 0%,#121b2f 75%)}}
.v3 canvas{display:block;width:100%;height:100%}
.v3load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--muted);text-align:center;padding:20px;font-size:.9rem}
.v3load svg{width:36px;height:36px;animation:pulse 1.4s ease-in-out infinite}
.v3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.v3lab{position:absolute;left:0;top:0;pointer-events:auto;border:0;border-radius:999px;padding:3px 9px;background:rgba(15,29,54,.82);color:#fff;font-size:.72rem;font-weight:600;white-space:nowrap;cursor:pointer}
.v3lab.on{background:var(--pri)}
.v3tip{position:absolute;pointer-events:none;padding:4px 9px;border-radius:8px;background:rgba(15,29,54,.88);color:#fff;font-size:.78rem;font-weight:600;white-space:nowrap}
.v3bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 4px 4px}
.v3ex{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--muted);flex:1;min-width:200px}
.v3ex input{flex:1;accent-color:var(--pri)}
.v3chk{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}.v3chk input{width:17px;height:17px;accent-color:var(--pri)}
.v3status{margin:6px 4px 0;font-size:.86rem;font-weight:600;color:var(--pri);min-height:1.3em}
.v3info{margin:8px 4px 0;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:.9rem}
.v3info p{margin:4px 0 0}.v3info small{color:var(--muted)}
.v3hint{margin:8px 4px 2px;font-size:.78rem}
/* ---- print / PDF ---- */
.print-head{display:none}
/* running header/footer and page numbers come from @page margin boxes written by app.js (#pageBoxes);
   the letterhead block below opens page 1 */
@media print{
  @page{size:A4;margin:18mm 15mm 18mm}
  html,body{background:#fff!important;color:#111}
  body{font-size:10.5pt;line-height:1.5}
  .print-head{display:flex!important;align-items:center;gap:10px;padding-bottom:3mm;margin-bottom:5mm;border-bottom:1.5pt solid #1f63c6;font-size:8.5pt;color:#111}
  .print-head .mono{width:30px;height:30px;border-radius:8px;font-size:.7rem;background:#1f63c6;color:#fff;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-head b{display:block;color:#16489a;font-size:11pt}.print-head small{display:block;color:#555;font-size:8pt}
  .print-head .pht{margin-inline-start:auto;font-weight:700;font-size:9.5pt;max-width:55%;text-align:end}
  .side,.top,.mbar,.tabbar,.btns,.secnav,.pn,.back,.toast,footer,.taside,.crumbs,.vtools,.aibox,.seg,.thumbs,.lb,.iptop,.pretools,.vtabs,#vt3d{display:none!important}
  #vtPhoto{display:block!important}
  .devbox:not(.ok){display:none}
  .ipres{position:static!important;max-height:none!important;overflow:visible!important}.ipcl:not([open]){display:none}
  .main{margin:0;min-height:0}.content{padding:0;max-width:none}
  .topic,.tmain{display:block}.grid{display:block}
  .card{box-shadow:none!important;border:.5pt solid #ccc;break-inside:avoid;margin-bottom:8px;background:#fff!important}
  .tsec,.sec,figure,table,.cstep{break-inside:avoid}.tsec{margin-bottom:10px}
  h2,h3,h4{break-after:avoid;color:#0d2a57}
  thead{display:table-header-group}
  .tbl th,.tbl td{border:.5pt solid #bbb!important;padding:3pt 5pt}
  a{color:#111;text-decoration:none}
  .rval b{color:#111!important}.cres{border-top-width:2pt}
  .viewer{aspect-ratio:auto!important;max-height:none!important}.viewer img{transform:none!important}
}
